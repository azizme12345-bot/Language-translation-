<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#17967A"/>
      <stop offset="100%" stop-color="#0E6B57"/>
    </linearGradient>
  </defs>

  <!-- Background rounded rectangle -->
  <rect x="0" y="0" width="256" height="256" rx="58" ry="58" fill="url(#bgGrad)"/>

  <!-- Left/Top White Speech Bubble -->
  <!-- Main bubble body: x=36, y=62, w=112, h=82, rx=24 -->
  <path d="M 60 62 
           L 124 62 
           A 24 24 0 0 1 148 86 
           L 148 120 
           A 24 24 0 0 1 124 144 
           L 78 144 
           L 48 172 
           L 54 144 
           A 24 24 0 0 1 36 120 
           L 36 86 
           A 24 24 0 0 1 60 62 Z" 
        fill="#FFFFFF"/>

  <!-- Letter 'A' inside white speech bubble -->
  <text x="91" y="125" 
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
        font-size="52" 
        font-weight="900" 
        fill="#0E6B57" 
        text-anchor="middle">A</text>

  <!-- Right/Bottom Overlapping Dark Green Speech Bubble -->
  <!-- Main bubble body: x=102, y=108, w=114, h=82, rx=24 -->
  <path d="M 126 108 
           L 192 108 
           A 24 24 0 0 1 216 132 
           L 216 166 
           A 24 24 0 0 1 192 190 
           L 170 190 
           L 212 214 
           L 178 190 
           L 126 190 
           A 24 24 0 0 1 102 166 
           L 102 132 
           A 24 24 0 0 1 126 108 Z" 
        fill="url(#bgGrad)" 
        stroke="#FFFFFF" 
        stroke-width="5" 
        stroke-linejoin="round" 
        stroke-linecap="round"/>

  <!-- Simple white vertical text cursor inside second bubble -->
  <line x1="160" y1="128" x2="160" y2="168" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
</svg>
